name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Configure Android Permissions, Icon & Lock-Screen Wakeup
        run: |
          pip3 install pillow
          python3 patch_manifest.py

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MEO ALARM APK
        uses: actions/upload-artifact@v4
        with:
          name: MEO-ALARM-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
